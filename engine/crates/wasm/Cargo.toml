[package]
name = "particle-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
sentry-smoke = []

[dependencies]
particle-sim.workspace = true
particle-sim-cpu.workspace = true
particle-sim-gpu.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["HtmlCanvasElement", "Window", "EventTarget", "CustomEvent", "CustomEventInit"] }

[lints]
workspace = true
