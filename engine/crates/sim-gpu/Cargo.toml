[package]
name = "particle-sim-gpu"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
particle-sim.workspace = true
wgpu.workspace = true

[dev-dependencies]
particle-sim-cpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sentry = { version = "=0.49.3", default-features = false, features = ["panic", "reqwest", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
web-sys = { version = "=0.3.85", features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12"] }

[lints]
workspace = true
