[workspace]
resolver = "2"
members = ["crates/sim", "crates/sim-cpu", "crates/sim-gpu", "crates/wasm"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.98.1"

[workspace.dependencies]
particle-sim = { path = "crates/sim" }
particle-sim-cpu = { path = "crates/sim-cpu" }
particle-sim-gpu = { path = "crates/sim-gpu" }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "wgsl"] }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.test]
# Keep the full numerical fixtures fast without dropping test-time safety checks.
opt-level = 3
debug-assertions = true
overflow-checks = true
