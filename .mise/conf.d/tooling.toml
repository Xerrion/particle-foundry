# Generated by xerrion-dev-tooling; rerun with the complete tool selection.

[tasks."build:docker"]
description = "Build the Docker image"
dir = "{{ vars.docker_dir }}"
run = "docker build {{ vars.docker_build_args }} --file {{ vars.docker_file | quote }} --tag {{ vars.docker_image | quote }} {{ vars.docker_context | quote }}"

[tasks."check:docker"]
description = "Check Dockerfiles with Hadolint"
dir = "{{ vars.docker_dir }}"
run = "hadolint {{ vars.docker_files }}"

[tasks."check:javascript"]
description = "Check lint and formatting with the project's Biome rules"
dir = "{{ vars.javascript_dir }}"
run = "biome check {{ vars.javascript_files }}"

[tasks."check:markdown"]
description = "Check Markdown with mise-managed markdownlint-cli2 and Prettier"
dir = "{{ vars.markdown_dir }}"
run = [
    "markdownlint-cli2 {{ vars.markdown_files }}",
    "prettier --check --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}",
]

[tasks."check:python"]
depends = [
    "lint:python",
    "typecheck:python",
]
description = "Check Python lint, formatting, and types"

[tasks."check:rust"]
description = "Check Rust formatting and Clippy warnings"
dir = "{{ vars.rust_dir }}"
run = [
    "cargo fmt --all -- --check",
    "cargo clippy --locked --workspace --all-targets -- -D warnings",
]

[tasks."deps:javascript"]
description = "Install JavaScript dependencies using bun"
dir = "web"
run = "bun install --frozen-lockfile"

[tasks."fix:python"]
description = "Apply safe Ruff lint fixes"
dir = "{{ vars.python_dir }}"
run = "ruff check --fix {{ vars.python_files }}"

[tasks."format:javascript"]
description = "Format files and apply Biome's safe fixes, including import organization"
dir = "{{ vars.javascript_dir }}"
run = "biome check --write {{ vars.javascript_files }}"

[tasks."format:markdown"]
description = "Format Markdown with mise-managed Prettier"
dir = "{{ vars.markdown_dir }}"
run = "prettier --write --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}"

[tasks."format:python"]
description = "Format Python with Ruff"
dir = "{{ vars.python_dir }}"
run = "ruff format {{ vars.python_files }}"

[tasks."format:rust"]
description = "Format the Rust workspace"
dir = "{{ vars.rust_dir }}"
run = "cargo fmt --all"

[tasks."lint:python"]
description = "Check Python lint and formatting with Ruff"
dir = "{{ vars.python_dir }}"
run = [
    "ruff check {{ vars.python_files }}",
    "ruff format --check {{ vars.python_files }}",
]

[tasks."run:docker"]
depends = ["build:docker"]
description = "Build and run the Docker image, removing the container on exit"
dir = "{{ vars.docker_dir }}"
run = "docker run --rm {{ vars.docker_run_args }} {{ vars.docker_image | quote }}"

[tasks."test:javascript"]
depends = ["test"]
description = "Run the project's test task and prerequisites"

[tasks."test:rust"]
description = "Run Rust workspace tests with Cargo.lock"
dir = "{{ vars.rust_dir }}"
run = "cargo test --locked --workspace"

[tasks."typecheck:javascript"]
depends = ["typecheck"]
description = "Run the project's typecheck task and prerequisites"

[tasks."typecheck:python"]
description = "Check Python types with ty"
dir = "{{ vars.python_dir }}"
run = "ty check --python-version {{ vars.python_version | quote }} {{ vars.python_files }}"

[tools]
biome = "2.5.15"
hadolint = "2.15.1"
markdownlint-cli2 = "0.23.3"
prettier = "3.9.10"
ruff = "0.17.1"
ty = "0.0.89"
uv = "0.13.1"

[vars]
docker_build_args = ""
docker_context = "."
docker_dir = "."
docker_file = "Dockerfile"
docker_files = "Dockerfile"
docker_image = "app:local"
docker_run_args = ""
javascript_dir = "web"
javascript_files = "."
markdown_dir = "."
markdown_files = "'**/*.md'"
python_dir = "docs/scripts"
python_executable = ".venv/bin/python"
python_files = "."
python_version = "3.15"
rust_dir = "engine"
