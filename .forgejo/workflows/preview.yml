name: PR preview

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to reconcile
        required: true
        type: string

concurrency:
  group: preview-${{ forgejo.event.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 60
    if: vars.COOLIFY_PREVIEW_ENABLED == 'true' && ((forgejo.event_name == 'pull_request_target' && forgejo.event.pull_request.base.ref == 'main' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository) || (forgejo.event_name == 'workflow_dispatch' && forgejo.ref == 'refs/heads/main'))
    steps:
      - name: Checkout trusted preview controller
        env:
          CI_TOKEN: ${{ forgejo.token }}
        run: |
          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          git -c http.followRedirects=false fetch --no-tags --depth=1 origin refs/heads/main
          git checkout -q --detach FETCH_HEAD
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_TOKEN
          PREVIEW_CONTROL_SHA=$(git rev-parse HEAD)
          test "${#PREVIEW_CONTROL_SHA}" -eq 40
          case "$PREVIEW_CONTROL_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          echo "PREVIEW_CONTROL_SHA=$PREVIEW_CONTROL_SHA" >> "$FORGEJO_ENV"
      - name: Reconcile the verified PR preview
        env:
          PR_NUMBER: ${{ forgejo.event.number || inputs.pr_number }}
          CI_SHA: ${{ forgejo.event.pull_request.head.sha }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_PREVIEW_PROJECT_UUID: ${{ vars.COOLIFY_PREVIEW_PROJECT_UUID }}
          COOLIFY_PREVIEW_SERVER_UUID: ${{ vars.COOLIFY_PREVIEW_SERVER_UUID }}
          COOLIFY_PREVIEW_ENV_UUID: ${{ vars.COOLIFY_PREVIEW_ENV_UUID }}
          COOLIFY_PREVIEW_DOMAIN_TEMPLATE: ${{ vars.COOLIFY_PREVIEW_DOMAIN_TEMPLATE }}
          COOLIFY_PREVIEW_KEY_NAME: ${{ vars.COOLIFY_PREVIEW_KEY_NAME }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CI_TOKEN: ${{ forgejo.token }}
        run: python .forgejo/ci/preview.py
