name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_SHA: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
  CI_BASE_SHA: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
  MISE_YES: "1"
  MISE_OFFLINE: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 15
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout from Forgejo
        env:
          CI_TOKEN: ${{ forgejo.token }}
        run: |
          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)"
          git fetch --no-tags  origin "$CI_SHA"
          git checkout -q --detach FETCH_HEAD
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_TOKEN
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          mise trust
      - name: Detect code changes
        id: scope
        run: |
          if ! git cat-file -e "${CI_BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${CI_SHA}^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$FORGEJO_OUTPUT"
            exit 0
          fi
          DIFF_BASE=$(git merge-base "$CI_BASE_SHA" "$CI_SHA") || {
            echo 'code=true' >> "$FORGEJO_OUTPUT"
            exit 0
          }
          git diff --no-renames --name-only "$DIFF_BASE" "$CI_SHA" > "$RUNNER_TEMP/changed-files"
          if awk '$0 !~ /^docs\// { found = 1 } END { exit !found }' "$RUNNER_TEMP/changed-files"; then
            echo 'code=true' >> "$FORGEJO_OUTPUT"
          else
            echo 'code=false' >> "$FORGEJO_OUTPUT"
          fi

  docs:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 15
    steps:
      - name: Checkout from Forgejo
        env:
          CI_TOKEN: ${{ forgejo.token }}
        run: |
          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)"
          git fetch --no-tags --depth=1 origin "$CI_SHA"
          git checkout -q --detach FETCH_HEAD
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_TOKEN
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          mise trust
      - run: mise run docs:check
      - name: Check native Forgejo helpers
        run: python -m unittest discover -s .forgejo/ci -p 'test_*.py'

  web:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout from Forgejo
        env:
          CI_TOKEN: ${{ forgejo.token }}
        run: |
          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)"
          git fetch --no-tags --depth=1 origin "$CI_SHA"
          git checkout -q --detach FETCH_HEAD
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_TOKEN
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          mise trust
      - name: Restore build cache
        run: python .forgejo/ci/cache.py restore web
      - run: mise run ci:web
      - name: Save successful build cache
        if: success()
        run: python .forgejo/ci/cache.py save web

  rust:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout from Forgejo
        env:
          CI_TOKEN: ${{ forgejo.token }}
        run: |
          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)"
          git fetch --no-tags --depth=1 origin "$CI_SHA"
          git checkout -q --detach FETCH_HEAD
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_TOKEN
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          mise trust
      - name: Restore build cache
        run: python .forgejo/ci/cache.py restore rust
      - run: mise run ci:rust
      - name: Save successful build cache
        if: success()
        run: python .forgejo/ci/cache.py save rust

  browser:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout from Forgejo
        env:
          CI_TOKEN: ${{ forgejo.token }}
        run: |
          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$CI_TOKEN" | base64 -w0)"
          git fetch --no-tags --depth=1 origin "$CI_SHA"
          git checkout -q --detach FETCH_HEAD
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_TOKEN
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          mise trust
      - name: Restore build cache
        run: python .forgejo/ci/cache.py restore browser
      - run: mise run ci:browser
      - name: Save browser evidence to Forgejo
        if: always()
        run: python .forgejo/ci/artifact.py
      - name: Save successful build cache
        if: success()
        run: python .forgejo/ci/cache.py save browser

  verify:
    runs-on: ubuntu-latest
    container:
      image: git.xerrion.io/xerrion/particle-foundry-ci@sha256:8a251ca7be81fbbd17037f0210fd6361d0e328dc9e3c9c5cb44983a282e38969
      credentials:
        username: ${{ forgejo.actor }}
        password: ${{ forgejo.token }}
    timeout-minutes: 15
    if: always()
    needs: [changes, docs, web, rust, browser]
    steps:
      - name: Require applicable checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          if test "$CODE_CHANGED" = true; then
            test "$WEB_RESULT" = success
            test "$RUST_RESULT" = success
            test "$BROWSER_RESULT" = success
          else
            test "$WEB_RESULT" = skipped
            test "$RUST_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
          fi
