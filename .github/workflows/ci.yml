name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-browser-smoke
          path: artifacts/validation/browser
