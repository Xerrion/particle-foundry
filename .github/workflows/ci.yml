name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_YES: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIFF_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || {
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          git diff --no-renames --name-only "$DIFF_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if awk '$0 !~ /^docs\// { found = 1 } END { exit !found }' "$RUNNER_TEMP/changed-files"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          version: 2026.10.14
      - run: mise run docs:install
      - run: mise run docs:check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: particle-foundry-handbook
          path: artifacts/docs
          retention-days: 7

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          version: 2026.10.14
      - run: mise run ci:web

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          version: 2026.10.14
      - run: mise run ci:rust

  browser:
    name: Browser WASM smoke (GPU optional)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          version: 2026.10.14
      - run: mise run ci:browser
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: engine-browser-smoke
          path: artifacts/validation/browser
          retention-days: 1

  verify:
    if: always()
    needs: [changes, docs, web, rust, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require applicable checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          case "$CODE_CHANGED" in
            true)
              test "$WEB_RESULT" = success
              test "$RUST_RESULT" = success
              test "$BROWSER_RESULT" = success
              ;;
            false)
              test "$WEB_RESULT" = skipped
              test "$RUST_RESULT" = skipped
              test "$BROWSER_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
