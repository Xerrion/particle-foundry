[tools]
bun = "1.3.12"
node = "24.15.0"
python = "3.14.7"

[env]
_.path = ["{{config_root}}/web/node_modules/.bin"]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install application, documentation and Rust/WASM dependencies"
depends = ["install", "docs:install", "rust:bindings-tool"]

[tasks.install]
description = "Install application dependencies from the frozen lockfile"
dir = "{{config_root}}/web"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the development server"
dir = "{{config_root}}/web"
depends = ["install", "build:wasm"]
run = "vite"

[tasks.build]
description = "Build the production application"
dir = "{{config_root}}/web"
depends = ["install", "build:wasm", "build:catalogue"]
run = ["vite build", "bun --no-env-file scripts/prepare-reporting.ts"]

[tasks."glitchtip:upload"]
description = "Upload the exact private source map artifacts from the prepared build"
dir = "{{config_root}}/web"
depends = ["install"]
run = "bun scripts/prepare-reporting.ts upload"

[tasks.preview]
description = "Serve the production build locally"
dir = "{{config_root}}/web"
depends = ["build"]
run = "vite preview"

[tasks.bench]
description = "Benchmark the physics simulation"
dir = "{{config_root}}/web"
depends = ["install"]
run = "bun benchmarks/physics.bench.ts"

[tasks.lint]
description = "Check formatting and lint rules"
dir = "{{config_root}}/web"
depends = ["install"]
run = "biome check ."

[tasks.format]
description = "Format application, test and configuration files"
dir = "{{config_root}}/web"
depends = ["install"]
run = "biome format --write ."

[tasks.typecheck]
description = "Check TypeScript types"
dir = "{{config_root}}/web"
depends = ["install", "build:wasm"]
run = "tsc --noEmit"

[tasks."typecheck:catalogue"]
description = "Check material IDs and catalogue types with strict indexing"
dir = "{{config_root}}/web"
depends = ["install"]
run = "tsc --noEmit -p tsconfig.catalogue.json"

[tasks.test]
description = "Run unit and integration tests"
dir = "{{config_root}}/web"
depends = ["install"]
# CI compiles Rust in parallel, which slows the existing CPU-heavy fixtures.
run = "bun test --timeout 30000 ./tests"

[tasks.check]
description = "Run both type checks and all tests"
depends = ["typecheck", "typecheck:catalogue", "test"]

[tasks."docs:install"]
description = "Install the existing Markdown renderer in the project virtual environment"
run = ["python -m ensurepip --upgrade", "python -m pip install markdown-it-py==4.0.0"]

[tasks."docs:check"]
description = "Validate documentation, links, manifests and historical evidence"
run = "python docs/scripts/validate-docs.py"

[tasks."docs:render"]
description = "Regenerate the GPU plan HTML from Markdown"
depends = ["docs:install"]
run = "python docs/scripts/render-plan.py"

[tasks.ci]
description = "Run all continuous integration checks"
depends = ["lint", "check", "build", "docs:check", "rust:fmt", "rust:test", "rust:clippy", "test:browser", "test:reporting"]
run = ["mise run check:wasm", "mise run check:catalogue"]

[tasks."ci:web"]
description = "Run web CI checks with one dependency installation"
depends = ["lint", "typecheck:catalogue", "test"]

[tasks."ci:rust"]
description = "Run native CI checks with one toolchain check"
depends = ["rust:fmt", "rust:clippy", "rust:test"]

[tasks."ci:browser"]
description = "Build and check browser assets with one shared WASM generation"
depends = ["build", "typecheck", "test:browser", "test:reporting"]
run = ["mise run check:wasm", "mise run check:catalogue"]

[tasks."build:catalogue"]
description = "Generate the candidate engine material projection from the authored catalogue"
dir = "{{config_root}}/web"
depends = ["install"]
run = "bun scripts/project-engine-catalogue.ts"

[tasks."check:catalogue"]
description = "Check candidate engine material projection freshness"
dir = "{{config_root}}/web"
depends = ["install"]
run = "bun scripts/project-engine-catalogue.ts --check"

[tasks."rust:toolchain"]
description = "Install or verify the toolchain pinned in engine/rust-toolchain.toml"
dir = "{{config_root}}/engine"
run = "rustup show"

[tasks."rust:bindings-tool"]
description = "Verify or install the wasm-bindgen CLI paired with the locked Rust library"
dir = "{{config_root}}/engine"
depends = ["rust:toolchain"]
run = """
if test "$(wasm-bindgen --version 2>/dev/null)" != 'wasm-bindgen 0.2.108'; then
  cargo install wasm-bindgen-cli --version 0.2.108 --locked
fi
"""

[tasks."rust:fmt"]
description = "Check Rust formatting"
dir = "{{config_root}}/engine"
depends = ["rust:toolchain"]
run = "cargo fmt --all -- --check"

[tasks."rust:test"]
description = "Run native Rust workspace and contract tests"
dir = "{{config_root}}/engine"
depends = ["rust:toolchain"]
run = "cargo test --locked --workspace"

[tasks."rust:clippy"]
description = "Check all native Rust targets with Clippy"
dir = "{{config_root}}/engine"
depends = ["rust:toolchain"]
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."rust:device-smoke"]
description = "Initialize a native wgpu adapter and device (requires GPU support)"
dir = "{{config_root}}/engine"
depends = ["rust:toolchain"]
run = "cargo run --locked -p particle-sim-gpu --example device-smoke"

[tasks."build:wasm"]
description = "Build locked Rust/WASM and generate browser bindings"
dir = "{{config_root}}/web"
depends = ["install", "rust:bindings-tool"]
run = "bun scripts/build-wasm.ts"

[tasks."build:wasm:reporting"]
description = "Build separate Rust/WASM bindings with a deliberate reporting panic"
dir = "{{config_root}}/web"
depends = ["install", "rust:bindings-tool"]
run = "bun scripts/build-wasm.ts --glitchtip-smoke"

[tasks."check:wasm"]
description = "Check generated WASM assets byte-for-byte against a fresh generation"
dir = "{{config_root}}/web"
depends = ["install", "rust:bindings-tool"]
run = "bun scripts/build-wasm.ts --check"

[tasks."test:browser"]
description = "Run production-bundled WASM lifecycle and optional WebGPU smoke"
dir = "{{config_root}}/web"
depends = ["install", "build:wasm"]
run = "bun scripts/test-browser.ts"

[tasks."test:reporting"]
description = "Verify browser errors and Rust/WASM panics with local event receivers"
dir = "{{config_root}}/web"
depends = ["install", "build:wasm:reporting"]
run = "bun scripts/test-reporting.ts"

[tasks."glitchtip:smoke:native"]
description = "Send one opt-in native Rust verification error"
dir = "{{config_root}}/engine"
depends = ["rust:toolchain"]
run = "cargo run --locked -p particle-sim-gpu --example glitchtip-smoke"

[tasks."validate:baseline"]
description = "Capture fresh legacy characterization, controls and timing evidence"
run = "bun web/scripts/validate-baseline.ts"
